name: Build TRADER AI VISION 3.0 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q VISION_3_SOURCE_FILES.zip -d extracted
          ANDROID_DIR=$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$ANDROID_DIR" ]; then
            echo "Android project not found in ZIP"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$ANDROID_DIR")
          cp -a "$PROJECT_ROOT"/. .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew || true
          if [ -f gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRADER-AI-VISION-3.0-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
